    <div class="tm" id="tm">
      <div class="tm-head">
        <span class="lbl">Time machine</span><b id="tmDate">Sep 2026</b><span class="note" id="tmCount"></span><span class="sp"></span>
        <button class="btn" type="button" id="tmPlay">▶ Replay three years</button><button class="btn" type="button" id="tmAll" hidden>Show all</button>
      </div>
      <div class="tm-track">
        <svg id="tmSpark" viewBox="0 0 1000 46" preserveAspectRatio="none" aria-hidden="true"></svg>
        <input type="range" id="tmRange" min="0" max="35" step="1" value="35" aria-label="Show sources published up to this month">
      </div>
      <div class="haxis"><span>Oct 2023</span><span>Oct 2024</span><span>Oct 2025</span><span>Sep 2026</span></div>
      <p class="note mts">Drag the slider to see the board as it stood in any month: story dots on the map and tiles in every topic appear as they were published. The line is AI's share of all news (GDELT).</p>
    </div>
